<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cubia : l'Évasion des 8 Mondes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1b26; --paper:#f4ead2; --paper2:#e2d3ad; --stone:#7d7d84; --stone-d:#4e4e56;
  --green:#5bbf3c; --green-d:#3a8a24; --gold:#ffcf3f; --red:#e8443a; --xp:#7cf04a; --sky:#8fd3ff;
  --px:'Press Start 2P', monospace; --tx:'Fredoka', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#16141f;color:#fff;font-family:var(--tx);overflow:hidden}
button{font-family:inherit;cursor:pointer}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow:hidden}
.screen.on{display:flex;animation:screenIn .5s ease}
@keyframes screenIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- Bouton "bloc" ---------- */
.mc-btn{position:relative;font-family:var(--px);font-size:13px;color:#fff;padding:14px 20px;border:3px solid #111;
  background:linear-gradient(#9a9aa3,#7a7a83);box-shadow:inset -3px -4px 0 #55555d,inset 3px 3px 0 #c4c4cc;text-shadow:2px 2px 0 #333;
  transition:transform .08s, filter .15s;letter-spacing:.5px}
.mc-btn:hover{filter:brightness(1.12) saturate(1.2);transform:translateY(-2px)}
.mc-btn:active{transform:translateY(2px);box-shadow:inset 3px 4px 0 #55555d}
.mc-btn.green{background:linear-gradient(#6fd24b,#4aa22f);box-shadow:inset -3px -4px 0 #2f7019,inset 3px 3px 0 #a6ef86}
.mc-btn.gold{background:linear-gradient(#ffd85a,#e9a91c);box-shadow:inset -3px -4px 0 #a86d07,inset 3px 3px 0 #fff0a6;color:#3a2600;text-shadow:1px 1px 0 #fff3}
.mc-btn.purple{background:linear-gradient(#b072ff,#7a3fe0);box-shadow:inset -3px -4px 0 #4b1f9e,inset 3px 3px 0 #d8b6ff}
.mc-btn:disabled{filter:grayscale(1) brightness(.7);cursor:not-allowed;transform:none}
.small{font-size:10px;padding:9px 12px}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;height:56px;display:none;align-items:center;gap:14px;padding:8px 14px;z-index:20;
  background:linear-gradient(#000a,#0000)}
#hud.on{display:flex}
#hearts{display:flex;gap:3px}
#hearts img{width:26px;height:22px}
#hearts img.lost{filter:grayscale(1) brightness(.4);opacity:.6}
#hearts img.pop{animation:heartPop .6s}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.8) rotate(-15deg)}100%{transform:scale(1)}}
#xpwrap{flex:1;max-width:340px;display:flex;align-items:center;gap:8px}
#xplvl{font-family:var(--px);font-size:14px;color:var(--xp);text-shadow:2px 2px 0 #000, 0 0 8px #7cf04a88;min-width:26px;text-align:center}
#xpbar{flex:1;height:12px;background:#222;border:2px solid #000;position:relative;overflow:hidden}
#xpfill{height:100%;width:0;background:linear-gradient(#b8ff8a,#5cd12a);transition:width .5s}
#hudright{margin-left:auto;display:flex;gap:8px;align-items:center}
#hudinv{display:flex;gap:2px;background:#0007;border:2px solid #000;padding:3px}
#hudinv .slot{width:28px;height:28px;background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff;display:grid;place-items:center}
#hudinv .slot img{width:22px;height:22px}
.iconbtn.off{filter:grayscale(1) brightness(.7)}
.iconbtn{width:40px;height:40px;font-size:18px;padding:0;display:grid;place-items:center}

/* ---------- Titre ---------- */
#scr-title{justify-content:center;background:linear-gradient(#5ab7f5 0%,#9ad9ff 60%,#c7ecff 100%)}
#title-rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rain-block{position:absolute;top:-80px;width:48px;height:48px;image-rendering:pixelated;animation:rain linear forwards;opacity:.9}
@keyframes rain{to{transform:translateY(calc(100vh + 120px)) rotate(var(--rot))}}
.cloud{position:absolute;height:28px;background:#fff;opacity:.85;box-shadow:24px -18px 0 #fff, 60px 0 0 #fff;animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.title-ground{position:absolute;left:0;right:0;bottom:0;height:96px;background-size:48px 48px;image-rendering:pixelated}
.title-box{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;max-width:900px;width:100%;
  max-height:calc(100% - 100px);overflow:auto}
.logo{font-family:var(--px);font-size:clamp(26px,5.4vw,58px);color:#fff;text-align:center;line-height:1.25;
  text-shadow:4px 4px 0 #3b3b3b,8px 8px 0 #00000055;letter-spacing:2px;animation:logoBob 3s ease-in-out infinite}
.logo .sub{display:block;font-size:.38em;color:var(--gold);margin-top:12px;text-shadow:3px 3px 0 #6b4a00}
@keyframes logoBob{50%{transform:translateY(-6px) rotate(-1deg)}}
.splash{font-family:var(--px);font-size:11px;color:#ffff55;text-shadow:2px 2px 0 #3f3f00;position:absolute;right:-10px;top:30px;
  transform:rotate(-18deg);animation:splash .5s ease-in-out infinite alternate}
@keyframes splash{to{transform:rotate(-18deg) scale(1.12)}}

/* Cube 3D */
.cube-scene{width:110px;height:110px;perspective:600px;margin:4px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 7s linear infinite}
.cube div{position:absolute;width:110px;height:110px;background-size:cover;image-rendering:pixelated;border:1px solid #0003}
.cube .f{transform:translateZ(55px)}.cube .b{transform:rotateY(180deg) translateZ(55px)}
.cube .r{transform:rotateY(90deg) translateZ(55px)}.cube .l{transform:rotateY(-90deg) translateZ(55px)}
.cube .t{transform:rotateX(90deg) translateZ(55px)}.cube .d{transform:rotateX(-90deg) translateZ(55px)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}

.panel{background:#c6c6c6;color:var(--ink);border:3px solid #111;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555;padding:18px}
.name-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.name-row label{font-family:var(--px);font-size:11px}
#pname{font-family:var(--tx);font-size:20px;padding:8px 12px;border:3px solid #111;background:#000;color:#fff;width:220px;outline:none}
#pname:focus{box-shadow:0 0 0 3px var(--gold)}
.lvl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.lvl{background:#0000;border:3px solid #111;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:#8b8b8b;box-shadow:inset 3px 3px 0 #bdbdbd,inset -3px -3px 0 #555;color:#111;transition:transform .15s}
.lvl:hover{transform:translateY(-4px) rotate(-1deg)}
.lvl.sel{background:#ffe27a;box-shadow:inset 3px 3px 0 #fff6c4,inset -3px -3px 0 #b38900,0 0 0 4px #fff,0 0 22px #ffd200;animation:selPulse 1s infinite alternate}
@keyframes selPulse{to{box-shadow:inset 3px 3px 0 #fff6c4,inset -3px -3px 0 #b38900,0 0 0 4px #fff,0 0 36px #ffd200}}
.lvl img{width:58px;height:58px;filter:drop-shadow(3px 3px 0 #0006)}
.lvl.sel img{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.lvl b{font-family:var(--px);font-size:12px}
.lvl span{font-size:14px;text-align:center;line-height:1.3}
.teacher{font-size:15px;display:flex;align-items:center;gap:8px;color:#222}
.teacher input{width:20px;height:20px}

/* ---------- Carte ---------- */
#scr-map{background:linear-gradient(#3c86d6,#79c3ff 55%,#bfe6ff);padding-top:64px}
.map-title{font-family:var(--px);font-size:clamp(14px,2.4vw,22px);text-shadow:3px 3px 0 #0006;margin:8px 0 2px;text-align:center}
.map-sub{font-size:17px;margin-bottom:8px;text-shadow:1px 1px 0 #0006;text-align:center;padding:0 10px}
.map{position:relative;width:min(1100px,96vw);flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:10px;padding:6px 6px 18px}
.island{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;color:#fff;
  animation:float 4s ease-in-out infinite;padding:4px;min-height:0}
.island:nth-child(2n){animation-delay:-2s}
.island:nth-child(3n){animation-delay:-1s}
@keyframes float{50%{transform:translateY(-10px)}}
.isle-blocks{position:relative;width:min(104px,14vw);aspect-ratio:1/1.3;filter:drop-shadow(0 14px 6px #0004)}
.isle-blocks img{position:absolute;width:50%;image-rendering:pixelated}
.island .nm{font-family:var(--px);font-size:9px;margin-top:8px;text-shadow:2px 2px 0 #000;text-align:center;line-height:1.5}
.island .ls{font-size:14px;font-weight:600;text-shadow:1px 1px 0 #000c;text-align:center;line-height:1.15;background:#0006;padding:3px 8px;margin-top:4px}
.island .stars{font-size:16px;letter-spacing:2px;height:20px;color:var(--gold);text-shadow:1px 1px 0 #000}
.island.locked .isle-blocks{filter:grayscale(1) brightness(.55) drop-shadow(0 14px 6px #0004)}
.island.locked{cursor:not-allowed}
.island .lock{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:34px;filter:drop-shadow(2px 2px 0 #000)}
.island.current .isle-blocks::after{content:"";position:absolute;inset:-14px;border:3px dashed #ffef7a;animation:spinDash 6s linear infinite;border-radius:50%}
@keyframes spinDash{to{transform:rotate(360deg)}}
.island:not(.locked):hover .isle-blocks{transform:scale(1.08) rotate(-2deg);transition:transform .2s}
.isle-hero{position:absolute;width:30px;left:50%;top:-34px;transform:translateX(-50%);animation:heroHop .9s ease-in-out infinite;image-rendering:pixelated;z-index:2}
@keyframes heroHop{50%{transform:translate(-50%,-8px)}}
.island .item-ico{position:absolute;right:-6px;top:-4px;width:30px;filter:drop-shadow(0 0 6px #fff);animation:twinkle 1.5s ease-in-out infinite}
@keyframes twinkle{50%{filter:drop-shadow(0 0 14px #fff) brightness(1.3)}}

/* ---------- Monde ---------- */
#scr-world{padding-top:56px}
.scene{position:relative;width:100%;height:44%;min-height:220px;overflow:hidden;flex-shrink:0}
.scene .sky{position:absolute;inset:0}
.scene .sun{position:absolute;width:54px;height:54px;top:22px;right:9%;box-shadow:0 0 40px 10px #fff6}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:64px;background-size:64px 64px;image-rendering:pixelated}
.scene .deco{position:absolute;bottom:64px;image-rendering:pixelated}
.wall-zone{position:absolute;bottom:64px;left:50%;transform:translateX(-10%);display:flex;align-items:flex-end;gap:0}
.wall{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,52px);gap:0}
.blk{width:52px;height:52px;position:relative;background-size:cover;image-rendering:pixelated;box-shadow:inset 0 0 0 1px #0002}
.blk .crack{position:absolute;inset:0;background-size:cover;image-rendering:pixelated;opacity:0}
.blk.gone{visibility:hidden}
.blk.target{outline:3px solid #fff;outline-offset:-3px;animation:targetBlink .8s steps(2) infinite}
@keyframes targetBlink{50%{outline-color:#0000}}
.chest{width:64px;height:58px;margin-left:10px;image-rendering:pixelated;transition:transform .3s}
.chest.open{animation:chestJump .8s ease}
@keyframes chestJump{30%{transform:translateY(-22px) scale(1.15)}60%{transform:translateY(0) scale(.95)}}
.hero{position:absolute;bottom:64px;left:calc(50% - 130px);width:46px;image-rendering:pixelated;transition:left .4s}
.hero.walk{animation:walk .3s steps(2) infinite}
@keyframes walk{50%{transform:translateY(-4px)}}
.pick{position:absolute;width:36px;bottom:92px;left:calc(50% - 98px);transform-origin:20% 80%;transform:rotate(-30deg);image-rendering:pixelated;transition:left .4s}
.pick.swing{animation:swing .45s ease}
@keyframes swing{0%{transform:rotate(-30deg)}35%{transform:rotate(-95deg)}70%{transform:rotate(40deg)}100%{transform:rotate(-30deg)}}
.lava{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffb21a,#ff5a0a 30%,#c12a00);z-index:4;
  box-shadow:0 0 40px 14px #ff6a0099;transition:height 1s linear}
.lava::before{content:"";position:absolute;left:0;right:0;top:-8px;height:10px;background:
  repeating-linear-gradient(90deg,#ffd23f 0 16px,#ff8a1a 16px 32px);animation:lavaFlow 1.2s linear infinite}
@keyframes lavaFlow{to{background-position:32px 0}}
.timer{position:absolute;top:10px;left:12px;z-index:5;font-family:var(--px);font-size:12px;background:#000a;padding:8px 10px;border:2px solid #000}
.timer.hot{color:#ff7b3b;animation:shakeX .3s infinite}
.world-label{position:absolute;top:10px;right:12px;z-index:5;text-align:right;background:#000a;padding:6px 10px;border:2px solid #000}
.world-label b{font-family:var(--px);font-size:10px;display:block;margin-bottom:4px;color:var(--gold)}
.world-label span{font-size:15px}
.progress-dots{position:absolute;left:50%;transform:translateX(-50%);top:12px;display:flex;gap:4px;z-index:5}
.progress-dots i{width:14px;height:14px;background:#0008;border:2px solid #000;display:block}
.progress-dots i.ok{background:var(--xp);box-shadow:0 0 8px var(--xp)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
@keyframes shakeX{50%{transform:translateX(2px)}}
.flash-red{position:absolute;inset:0;background:#ff000055;pointer-events:none;animation:fade .5s forwards;z-index:30}
@keyframes fade{to{opacity:0}}

.qzone{flex:1;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:14px;overflow:auto;
  background:#3b2a1a;background-size:64px 64px;image-rendering:pixelated}
.qcard{width:min(820px,100%);background:var(--paper);color:var(--ink);border:4px solid #3a2a14;padding:18px 22px 20px;position:relative;
  box-shadow:6px 6px 0 #0007, inset 0 0 0 3px #fff8;animation:cardIn .35s cubic-bezier(.2,1.4,.5,1)}
@keyframes cardIn{from{transform:translateY(30px) scale(.9);opacity:0}}
.qtag{font-family:var(--px);font-size:10px;display:inline-block;background:#3a2a14;color:var(--gold);padding:6px 8px;margin-bottom:12px}
.qtext{font-size:clamp(20px,2.6vw,27px);font-weight:600;line-height:1.4;margin-bottom:16px}
.blank{display:inline-block;min-width:70px;border-bottom:4px dashed #b0753a;text-align:center;color:#b0753a;padding:0 4px}
.blank.filled{border-bottom-color:var(--green-d);color:var(--green-d);border-bottom-style:solid;animation:pop .4s}
.blank.filled.bad{border-bottom-color:var(--red);color:var(--red)}
@keyframes pop{50%{transform:scale(1.25)}}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{flex:1 1 180px;font-family:var(--tx);font-size:23px;font-weight:600;padding:14px 12px;border:3px solid #111;color:#fff;
  background:linear-gradient(#8c8c95,#6d6d76);box-shadow:inset -3px -4px 0 #4a4a52,inset 3px 3px 0 #b9b9c2;text-shadow:2px 2px 0 #333;transition:transform .1s, filter .1s}
.opt:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-3px)}
.opt.good{background:linear-gradient(#6fd24b,#3f9a24);animation:pop .4s}
.opt.bad{background:linear-gradient(#ef5b4f,#b52a20);animation:shake .4s}
.opt.dim{opacity:.35}
.opt:disabled{cursor:default}
.typerow{display:flex;gap:10px;flex-wrap:wrap}
.typein{flex:1 1 240px;font-family:var(--tx);font-size:26px;font-weight:600;padding:10px 14px;border:3px solid #111;background:#fffdf5;color:#111;outline:none}
.typein:focus{box-shadow:0 0 0 4px var(--gold)}
.typein.good{background:#c9f7b4}.typein.bad{background:#ffc9c4;animation:shake .4s}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.accents button{font-family:var(--tx);font-size:20px;font-weight:600;width:42px;height:40px;border:2px solid #111;background:#e9dcb8;box-shadow:inset -2px -3px 0 #b49f6b}
.accents button:hover{background:#fff2c8}
.qtools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.hintbtn{font-size:16px;font-family:var(--tx);font-weight:600;border:3px solid #111;padding:8px 12px;background:#ffe27a;box-shadow:inset -3px -3px 0 #c79a12}
.hintbtn:disabled{filter:grayscale(1);opacity:.6}
.lessonbtn{font-size:16px;font-family:var(--tx);font-weight:600;border:3px solid #111;padding:8px 12px;background:#cfe8ff;box-shadow:inset -3px -3px 0 #6d9cc8}
.speak{font-size:22px;font-family:var(--tx);font-weight:700;border:3px solid #111;padding:14px 18px;background:#b9f0ff;box-shadow:inset -3px -4px 0 #4fa8c4;
  display:flex;gap:10px;align-items:center;margin-bottom:14px;animation:speakPulse 1.4s infinite}
@keyframes speakPulse{50%{box-shadow:inset -3px -4px 0 #4fa8c4,0 0 0 6px #b9f0ff88}}
.hinttext{font-size:17px;color:#7a4b00;font-weight:600;margin-top:8px;min-height:1px}
.feedback{margin-top:16px;padding:14px 16px;border:3px solid #111;font-size:19px;line-height:1.45;animation:cardIn .3s}
.feedback.ok{background:#d6f8c4}
.feedback.ko{background:#ffe0dc}
.feedback b.big{font-family:var(--px);font-size:13px;display:block;margin-bottom:8px}
.feedback .row{display:flex;justify-content:flex-end;margin-top:10px}
.flashword{font-size:34px;font-weight:700;text-align:center;padding:10px;background:#fff;border:3px dashed #b0753a;margin-bottom:12px}

/* ---------- Modale ---------- */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal.on{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.mbox{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);border:4px solid #3a2a14;padding:22px 24px;
  box-shadow:8px 8px 0 #000a;animation:unroll .45s cubic-bezier(.2,1.3,.5,1);position:relative}
@keyframes unroll{from{transform:scaleY(.1);opacity:0}}
.mbox.scroll{background:linear-gradient(90deg,#d8c08a,#f6ecd0 8%,#f6ecd0 92%,#d8c08a)}
.mbox h2{font-family:var(--px);font-size:15px;line-height:1.5;margin:0 0 14px;color:#5a3a12}
.mbox p,.mbox li{font-size:19px;line-height:1.5}
.mbox .ex{background:#fff8e2;border-left:6px solid #b0753a;padding:8px 12px;margin:8px 0;font-size:19px}
.mbox .mrow{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.mbox .center{text-align:center}
.reward-img{width:110px;height:110px;image-rendering:pixelated;display:block;margin:6px auto;animation:rewardSpin 2s ease-in-out infinite;filter:drop-shadow(0 0 16px #ffe46b)}
@keyframes rewardSpin{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.1)}}
.digit{font-family:var(--px);font-size:34px;color:#fff;background:#3a2a14;display:inline-block;padding:12px 16px;margin:6px;text-shadow:3px 3px 0 #000;animation:pop .6s}
.bigstars{font-size:44px;color:var(--gold);text-shadow:2px 2px 0 #7a5200;letter-spacing:6px}
.bigstars span{display:inline-block;animation:starIn .5s backwards}
.bigstars span:nth-child(2){animation-delay:.2s}.bigstars span:nth-child(3){animation-delay:.4s}
.bigstars span.off{color:#0003;text-shadow:none}
@keyframes starIn{from{transform:scale(3) rotate(90deg);opacity:0}}

/* ---------- Final ---------- */
#scr-final{padding-top:60px;background:radial-gradient(circle at 50% 40%,#3b2466,#120b22 70%)}
.final-wrap{display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:10px;width:100%;overflow:auto;flex:1}
.ftitle{font-family:var(--px);font-size:clamp(13px,2vw,18px);text-align:center;margin:8px 0;text-shadow:3px 3px 0 #000;color:#e7d1ff}
.craft{display:grid;grid-template-columns:repeat(3,64px);gap:4px;padding:10px;background:#c6c6c6;border:3px solid #111;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555}
.cslot{width:64px;height:64px;background:#8b8b8b;box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff;display:grid;place-items:center;position:relative}
.cslot img{width:48px;height:48px;animation:pop .35s}
.cslot.center{background:#5d3fa0;box-shadow:inset 3px 3px 0 #2c1a55,inset -3px -3px 0 #a888ef}
.cslot .n{position:absolute;bottom:2px;right:4px;font-family:var(--px);font-size:8px;color:#fff;text-shadow:1px 1px 0 #000}
.inv{display:grid;grid-template-columns:repeat(4,64px);gap:4px;padding:10px;background:#c6c6c6;border:3px solid #111;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555}
.inv button{border:none;width:64px;height:64px;background:#8b8b8b;box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff;position:relative;padding:0}
.inv button img{width:46px;height:46px}
.inv button:hover:not(:disabled){background:#a9a9a9}
.inv button:disabled{opacity:.25}
.inv button .d{position:absolute;bottom:2px;right:4px;font-family:var(--px);font-size:11px;color:#ffef7a;text-shadow:2px 2px 0 #000}
.inv button .w{position:absolute;top:2px;left:4px;font-family:var(--px);font-size:8px;color:#fff;text-shadow:1px 1px 0 #000}
.portal{width:170px;height:240px;position:relative;border:14px solid #2a1f3d;background:#120b22;overflow:hidden;box-shadow:0 0 0 4px #000}
.portal .swirl{position:absolute;inset:-60%;background:conic-gradient(from 0deg,#3cf5d6,#8a4dff,#ffd23f,#3cf5d6,#8a4dff,#ffd23f,#3cf5d6);opacity:0;transition:opacity 1.5s;animation:swirl 3s linear infinite;filter:blur(8px)}
.portal.lit .swirl{opacity:.95}
.portal.lit{box-shadow:0 0 0 4px #000,0 0 60px 20px #8a4dffaa}
@keyframes swirl{to{transform:rotate(360deg)}}
.keypad{display:grid;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;margin-top:8px}
.keypad button{font-family:var(--px);font-size:16px;height:52px;border:3px solid #111;background:linear-gradient(#9a9aa3,#7a7a83);color:#fff;box-shadow:inset -3px -4px 0 #55555d,inset 3px 3px 0 #c4c4cc}
.keypad button:active{transform:translateY(2px)}
.codebox{display:flex;gap:6px;justify-content:center;margin:8px 0}
.codebox span{width:34px;height:44px;border:3px solid #111;background:#000;color:#7cf04a;font-family:var(--px);font-size:18px;display:grid;place-items:center}
.codebox.bad span{animation:shake .4s;color:#ff5a4a}
.boss{display:flex;flex-direction:column;align-items:center;gap:6px}
.boss img{width:150px;image-rendering:pixelated;animation:bossIdle 2s ease-in-out infinite}
.boss img.hit{animation:bossHit .5s}
@keyframes bossIdle{50%{transform:translateY(-8px) scale(1.02)}}
@keyframes bossHit{20%{transform:translateX(-14px) rotate(-8deg);filter:brightness(3) saturate(0)}60%{transform:translateX(10px) rotate(5deg)}}
.bosshp{width:240px;height:18px;border:3px solid #000;background:#300}
.bosshp div{height:100%;background:linear-gradient(#ff7a6a,#c4160a);transition:width .5s}
.fstage{display:flex;flex-direction:column;align-items:center;gap:10px}
.fq{width:min(760px,96vw)}

/* ---------- Victoire ---------- */
#scr-win{justify-content:center;background:radial-gradient(circle at 50% 30%,#ffe9a8,#ffa94d 45%,#7a3fe0 100%)}
.cert{z-index:60;background:var(--paper);color:var(--ink);border:6px double #7a4b12;padding:26px 30px;width:min(640px,94vw);text-align:center;box-shadow:10px 10px 0 #0006;position:relative;animation:unroll .7s}
.cert h1{font-family:var(--px);font-size:clamp(14px,2.4vw,20px);line-height:1.6;color:#7a3fe0;margin:0 0 10px}
.cert .who{font-size:34px;font-weight:700;margin:6px 0}
.cert p{font-size:19px;margin:6px 0}
.cert .stats{display:flex;justify-content:center;gap:18px;margin:14px 0;flex-wrap:wrap}
.cert .stats div{background:#3a2a14;color:#fff;padding:10px 14px;font-family:var(--px);font-size:11px;line-height:1.8}
.cert .stats b{color:var(--gold);font-size:16px;display:block}
.medal{width:80px;position:absolute;top:-30px;right:-20px;transform:rotate(12deg);image-rendering:pixelated;animation:bob 1.6s infinite}

@media (max-width:760px){
  .map{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
  .lvl-grid{grid-template-columns:1fr}
  .lvl{flex-direction:row;justify-content:flex-start;text-align:left}
  .lvl span{text-align:left}
  .wall-zone{transform:translateX(-20%)}
  .blk{width:40px;height:40px}.wall{grid-template-rows:repeat(3,40px)}
  .hero{left:calc(50% - 110px)}.pick{left:calc(50% - 80px)}
  #hudinv{display:none}
  .progress-dots{top:auto;bottom:74px}
  .world-label span{font-size:13px}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="hearts"></div>
    <div id="xpwrap"><div id="xplvl">0</div><div id="xpbar"><div id="xpfill"></div></div></div>
    <div id="hudright">
      <div id="hudinv"></div>
      <button class="mc-btn iconbtn" id="btn-map" title="Carte">🗺️</button>
      <button class="mc-btn iconbtn" id="btn-music" title="Musique">🎵</button>
      <button class="mc-btn iconbtn" id="btn-mute" title="Tous les sons">🔊</button>
    </div>
  </div>

  <!-- TITRE -->
  <section class="screen on" id="scr-title">
    <div id="title-rain"></div>
    <div class="title-ground" id="title-ground"></div>
    <div class="title-box">
      <div style="position:relative">
        <div class="logo">CUBIA<span class="sub">L'Évasion des 8 Mondes</span></div>
        <div class="splash">Orthographe !</div>
      </div>
      <div class="cube-scene"><div class="cube" id="cube"><div class="f"></div><div class="b"></div><div class="r"></div><div class="l"></div><div class="t"></div><div class="d"></div></div></div>
      <div class="panel" style="width:100%;display:flex;flex-direction:column;gap:14px;align-items:center">
        <div class="name-row"><label for="pname">Ton pseudo :</label><input id="pname" maxlength="16" placeholder="Explorateur" autocomplete="off"></div>
        <div style="font-family:var(--px);font-size:11px">Choisis ton niveau de maîtrise</div>
        <div class="lvl-grid" id="lvl-grid"></div>
        <label class="teacher"><input type="checkbox" id="unlock"> Mode enseignant : tous les mondes ouverts</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="mc-btn green" id="btn-play">▶ JOUER</button>
          <button class="mc-btn small" id="btn-reset">Nouvelle partie</button>
          <button class="mc-btn small" id="btn-music2">🎵 Musique : oui</button>
        </div>
      </div>
    </div>
  </section>

  <!-- CARTE -->
  <section class="screen" id="scr-map">
    <div class="map-title">Carte des 8 Mondes</div>
    <div class="map-sub" id="map-sub">Bats chaque monde pour récupérer un objet et un chiffre secret.</div>
    <div class="map" id="map"></div>
  </section>

  <!-- MONDE -->
  <section class="screen" id="scr-world">
    <div class="scene" id="scene">
      <div class="sky" id="sky"></div>
      <div class="sun" id="sun"></div>
      <div id="decos"></div>
      <div class="ground" id="ground"></div>
      <img class="hero px" id="hero" alt="">
      <img class="pick px" id="pick" alt="">
      <div class="wall-zone"><div class="wall" id="wall"></div><img class="chest px" id="chest" alt=""></div>
      <div class="lava" id="lava"></div>
      <div class="timer" id="timer" style="display:none"></div>
      <div class="progress-dots" id="dots"></div>
      <div class="world-label" id="wlabel"></div>
    </div>
    <div class="qzone" id="qzone"></div>
  </section>

  <!-- FINAL -->
  <section class="screen" id="scr-final">
    <div class="ftitle" id="ftitle">Le Portail de Sortie</div>
    <div class="final-wrap" id="final"></div>
  </section>

  <!-- VICTOIRE -->
  <section class="screen" id="scr-win"><div id="win"></div></section>

  <div id="modal"><div class="mbox" id="mbox"></div></div>
  <canvas id="fx"></canvas>
</div>

<script>
/* =========================================================
   CONTENU PÉDAGOGIQUE (d'après les 8 leçons d'orthographe)
   c = question à choix : [phrase, [options], index bonne réponse, explication]
   t = réponse à écrire : [consigne, [réponses acceptées], explication]
   v = mots de la dictée : [bonne orthographe, piège 1, piège 2]
   ========================================================= */
const LESSONS = [
{ id:1, biome:"Plaine de la Tour de Fer", title:"Le pluriel des noms", dictee:"La tour Eiffel",
  block:"iron_ore", ground:"grass", sky:["#5fb6f2","#bfe7ff"], sun:"#fff6a8", amb:"leaf",
  item:{name:"Lingot de fer", spr:"ingot"},
  rule:`<p>Dans le groupe nominal, <b>le nom s'accorde avec le déterminant</b> : si le déterminant est au pluriel, le nom l'est aussi.</p>
  <p>En général, pour former le pluriel, on ajoute un <b>-s</b> à la fin du nom.</p><div class="ex">un monument → des monument<b>s</b></div>
  <p>Si le nom se termine déjà par <b>-s, -x ou -z</b>, il ne change pas au pluriel.</p><div class="ex">un pays → des pays</div>`,
  c:[
   ["un monument → des ___",["monument","monuments","monumentx"],1,"On ajoute un <b>s</b> : des monument<b>s</b>."],
   ["un pays → des ___",["pays","payss","payx"],0,"<b>Pays</b> se termine déjà par un s : il ne change pas au pluriel."],
   ["une tour → plusieurs ___",["tour","toure","tours"],2,"« plusieurs » est un déterminant pluriel : des tour<b>s</b>."],
   ["Quel nom ne change PAS au pluriel ?",["la tonne","le pays","le sommet"],1,"Les noms terminés par <b>s, x ou z</b> ne changent pas : le pays → les pays."],
   ["Il y a plusieurs ___ au sommet.",["ampoule","ampoules","ampoulex"],1,"« plusieurs » → le nom prend un <b>s</b> : ampoule<b>s</b>."],
   ["un nez → des ___",["nezs","nez","nés"],1,"<b>Nez</b> se termine par un z : il ne change pas au pluriel."],
   ["Quelle phrase est correcte ?",["Elle pèse des millier de tonnes.","Elle pèse des milliers de tonnes.","Elle pèse des milliers de tonne."],1,"« des » est pluriel : milliers et tonnes prennent un <b>s</b>."],
   ["la dizaine → des ___",["dizaines","dizaine","dizainex"],0,"On ajoute un <b>s</b> : des dizaine<b>s</b>."],
   ["un prix → des ___",["prixs","prix","pris"],1,"<b>Prix</b> se termine par un x : il ne change pas au pluriel."]
  ],
  t:[
   ["Écris au pluriel : une construction → des ___",["constructions"],"On ajoute un <b>s</b> : des construction<b>s</b>."],
   ["Écris au pluriel : un mètre → trois ___",["mètres"],"« trois » est pluriel : des mètre<b>s</b>."],
   ["Écris au pluriel : une peinture → des ___",["peintures"],"On ajoute un <b>s</b> : des peinture<b>s</b>."],
   ["Écris au pluriel : une souris → des ___",["souris"],"<b>Souris</b> finit par un s : il ne change pas."],
   ["Écris au pluriel : un million → deux ___",["millions"],"On ajoute un <b>s</b> : deux million<b>s</b>."],
   ["Écris au pluriel : un sommet → des ___",["sommets"],"On ajoute un <b>s</b> : des sommet<b>s</b>."]
  ],
  v:[["la construction","la constrution","la construcsion"],["la peinture","la painture","la peinturre"],["le sommet","le somet","le sommait"],
     ["l'ampoule","l'empoule","l'ampoul"],["plusieurs","plusieur","plusieures"],["au-dessus","au-desus","au-dessu"],
     ["célèbre","célébre","selèbre"],["nécessiter","nécéssiter","nésessiter"],["chaque","chake","chaques"],["la dizaine","la dixaine","la disaine"],
     ["la tonne","la tone","la tonnes"],["briller","brillé","brier"]]
},
{ id:2, biome:"Désert des Arènes", title:"Écrire « a » ou « à »", dictee:"L'amphithéâtre de Nîmes",
  block:"sandstone", ground:"sand", sky:["#ffb85c","#ffe9a8"], sun:"#fff1c2", amb:"sand",
  item:{name:"Pépite d'or", spr:"nugget"},
  rule:`<p><b>a</b> (sans accent), c'est le verbe <b>avoir</b>. On peut le remplacer par <b>avait</b>.</p>
  <div class="ex">L'amphithéâtre <b>a</b> été construit par les Gallo-Romains.<br>(L'amphithéâtre <i>avait</i> été construit…)</div>
  <p><b>à</b> (avec un accent grave) est une préposition. On ne peut pas le remplacer par « avait ».</p>
  <div class="ex">Elle visite l'amphithéâtre <b>à</b> Nîmes.</div>`,
  c:[
   ["L'amphithéâtre ___ été construit par les Gallo-Romains.",["a","à"],0,"On peut dire « l'amphithéâtre <b>avait</b> été construit » → <b>a</b>."],
   ["Elle visite l'amphithéâtre ___ Nîmes.",["a","à"],1,"« elle visite l'amphithéâtre <i>avait</i> Nîmes » ne veut rien dire → <b>à</b>."],
   ["Le gladiateur ___ un bouclier.",["a","à"],0,"« Le gladiateur <b>avait</b> un bouclier » → verbe avoir → <b>a</b>."],
   ["Les spectateurs vont ___ l'arène.",["a","à"],1,"On ne peut pas dire « vont <i>avait</i> l'arène » → <b>à</b>."],
   ["Le combat commence ___ midi.",["a","à"],1,"Impossible de remplacer par « avait » → <b>à</b>."],
   ["Cet amphithéâtre ___ accueilli des milliers de spectateurs.",["a","à"],0,"« Cet amphithéâtre <b>avait</b> accueilli » → <b>a</b>."],
   ["Ce monument ___ plusieurs siècles.",["a","à"],0,"« Ce monument <b>avait</b> plusieurs siècles » → <b>a</b>."],
   ["On accède ___ l'étage par un escalier.",["a","à"],1,"« On accède <i>avait</i> l'étage » ne veut rien dire → <b>à</b>."],
   ["Le Gallo-Romain ___ compté les gradins.",["a","à"],0,"« Le Gallo-Romain <b>avait</b> compté » → <b>a</b>."]
  ],
  t:[
   ["Écris a ou à : « Il ___ assisté au spectacle. »",["a"],"« Il <b>avait</b> assisté » → <b>a</b>."],
   ["Écris a ou à : « Nous allons ___ Nîmes. »",["à"],"On ne peut pas dire « avait Nîmes » → <b>à</b> (avec accent)."],
   ["Écris a ou à : « L'arène ___ un étage en haut. »",["a"],"« L'arène <b>avait</b> un étage » → <b>a</b>."],
   ["Écris a ou à : « Il s'installe ___ l'intérieur. »",["à"],"Impossible de remplacer par « avait » → <b>à</b>."],
   ["Écris a ou à : « Ce lieu ___ connu des combats violents. »",["a"],"« Ce lieu <b>avait</b> connu » → <b>a</b>."]
  ],
  v:[["le siècle","le siécle","le sciècle"],["une époque","une épok","une époc"],["la hauteur","la auteur","la hauteure"],
     ["le spectateur","le spectateure","le spectatteur"],["la bataille","la bataile","la batailles"],["accueillir","acceuillir","accueuillir"],
     ["assister","asister","assistter"],["construit","construi","constrit"],["romain","romin","romein"],["jusqu'à","jusqu'a","jusca"],
     ["grâce","grace","grâsse"],["peut-être","peu-être","peut-ètre"],["la Gaule","la Gôle","la Gaulle"],["compter","conpter","comter"]]
},
{ id:3, biome:"Forêt de la Cathédrale", title:"Écrire « et » ou « est »", dictee:"La cathédrale de Reims",
  block:"stonebrick", ground:"grass", sky:["#4fae7a","#bff0c9"], sun:"#fffbd0", amb:"leaf",
  item:{name:"Éclat de vitrail", spr:"glass"},
  rule:`<p><b>est</b>, c'est le verbe <b>être</b>. On peut le remplacer par <b>était</b>.</p>
  <div class="ex">Cette ville <b>est</b> splendide. (Elle <i>était</i> splendide.)</div>
  <p><b>et</b> relie deux mots ou deux groupes de mots. On peut le remplacer par <b>et puis</b>.</p>
  <div class="ex">J'ai visité la cathédrale <b>et</b> le musée. (… <i>et puis</i> le musée.)</div>`,
  c:[
   ["Cette ville ___ splendide.",["et","est"],1,"« Cette ville <b>était</b> splendide » → <b>est</b>."],
   ["J'ai visité la cathédrale ___ le musée des beaux-arts.",["et","est"],0,"« la cathédrale <b>et puis</b> le musée » → <b>et</b>."],
   ["La cathédrale ___ gothique.",["et","est"],1,"« La cathédrale <b>était</b> gothique » → <b>est</b>."],
   ["Le ciel ___ bleu ___ la lumière entre par les vitraux.",["est … et","et … est","est … est"],0,"« Le ciel <b>était</b> bleu <b>et puis</b> la lumière… » → <b>est</b> puis <b>et</b>."],
   ["Ce lieu ___ connu dans toute la France.",["et","est"],1,"« Ce lieu <b>était</b> connu » → <b>est</b>."],
   ["Les vitraux sont anciens ___ restaurés.",["et","est"],0,"« anciens <b>et puis</b> restaurés » → <b>et</b>."],
   ["L'édifice ___ illuminé le soir.",["et","est"],1,"« L'édifice <b>était</b> illuminé » → <b>est</b>."],
   ["Le roi entre ___ s'installe.",["et","est"],0,"« Le roi entre <b>et puis</b> s'installe » → <b>et</b>."],
   ["Aujourd'hui, la cathédrale ___ restaurée.",["et","est"],1,"« la cathédrale <b>était</b> restaurée » → <b>est</b>."]
  ],
  t:[
   ["Écris et ou est : « La cathédrale ___ très ancienne. »",["est"],"« La cathédrale <b>était</b> très ancienne » → <b>est</b>."],
   ["Écris et ou est : « le Moyen Âge ___ la Révolution »",["et"],"« le Moyen Âge <b>et puis</b> la Révolution » → <b>et</b>."],
   ["Écris et ou est : « L'art gothique ___ célèbre. »",["est"],"« L'art gothique <b>était</b> célèbre » → <b>est</b>."],
   ["Écris et ou est : « Il peint ___ dessine. »",["et"],"« Il peint <b>et puis</b> dessine » → <b>et</b>."],
   ["Écris et ou est : « Le vitrail ___ bombardé pendant la guerre. »",["est"],"« Le vitrail <b>était</b> bombardé » → <b>est</b>."]
  ],
  v:[["la cathédrale","la catédrale","la cathèdrale"],["un édifice","un édiffice","un aidifice"],["des vitraux","des vitrails","des vitrauxs"],
     ["la lumière","la lumiaire","la lumièrre"],["gothique","gotique","gothik"],["français","francais","fransais"],
     ["restauré","restoré","réstauré"],["ancien","ensien","anciain"],["toujours","toujour","toujoure"],["pendant","pandant","pendent"],
     ["aujourd'hui","aujourdhui","aujour d'hui"],["ensuite","ansuite","ensuitte"],["chacun","chaqun","chaccun"],["la démonstration","la démontration","la démonstrassion"]]
},
{ id:4, biome:"Grotte des Peintures", title:"Écrire « s » ou « ss »", dictee:"La grotte de Lascaux",
  block:"coal_ore", ground:"stone", sky:["#1d1828","#3b3150"], sun:"", amb:"drip",
  item:{name:"Torche ancienne", spr:"torch"},
  rule:`<p>La lettre <b>s</b> se prononce [s] <b>entre une voyelle et une consonne</b>, en <b>début</b> ou en <b>fin</b> de mot.</p>
  <div class="ex">un arti<b>s</b>te, un <b>s</b>igne, un o<b>s</b></div>
  <p>Pour obtenir le son [s] <b>entre deux voyelles</b>, on écrit <b>ss</b>.</p>
  <div class="ex">un cha<b>ss</b>eur, un de<b>ss</b>in</div>
  <p>⚠️ Un seul s entre deux voyelles se prononce [z] : un oi<b>s</b>eau.</p>`,
  c:[
   ["un de___in",["s","ss"],1,"Le son [s] est entre deux voyelles (e et i) → <b>ss</b> : de<b>ss</b>in."],
   ["un cha___eur",["s","ss"],1,"Entre deux voyelles (a et e) → <b>ss</b> : cha<b>ss</b>eur."],
   ["un arti___te",["s","ss"],0,"Entre une voyelle et une consonne (i et t) → <b>s</b> : arti<b>s</b>te."],
   ["le ___igne",["s","ss"],0,"En début de mot → <b>s</b> : <b>s</b>igne."],
   ["Quel mot se prononce avec le son [z] ?",["un dessin","un oiseau","un signe"],1,"Un seul s entre deux voyelles fait [z] : oi<b>s</b>eau."],
   ["au___i (= également)",["s","ss"],1,"Entre deux voyelles (u et i) → <b>ss</b> : au<b>ss</b>i."],
   ["impre___ionnant",["s","ss"],1,"Entre deux voyelles (e et i) → <b>ss</b> : impre<b>ss</b>ionnant."],
   ["la Préhi___toire",["s","ss"],0,"Entre une voyelle et une consonne (i et t) → <b>s</b>."],
   ["le per___onnage",["s","ss"],0,"Après une consonne (r) → un seul <b>s</b> : per<b>s</b>onnage."],
   ["Le chasseur est ble___é.",["s","ss"],1,"Entre deux voyelles (e et é) → <b>ss</b> : ble<b>ss</b>é."]
  ],
  t:[
   ["Complète le mot : un de?in",["dessin","un dessin"],"Son [s] entre deux voyelles → <b>ss</b>."],
   ["Complète le mot : un cha?eur",["chasseur","un chasseur"],"Son [s] entre deux voyelles → <b>ss</b>."],
   ["Complète le mot : un arti?te",["artiste","un artiste"],"Voyelle + consonne → <b>s</b>."],
   ["Complète le mot : au?i",["aussi"],"Son [s] entre deux voyelles → <b>ss</b>."],
   ["Complète le mot : bле?é → (blessé)".replace("bле","ble"),["blessé"],"Son [s] entre deux voyelles → <b>ss</b>."],
   ["Complète le mot : ja?i?",["jadis"],"Le s de <b>jadis</b> : un seul s (entre a et i on entend [d]… puis s final)."]
  ],
  v:[["la grotte","la grote","la grotthe"],["des animaux","des animals","des animeaux"],["la Préhistoire","la Préistoire","la Préhistoir"],
     ["le personnage","le personage","le pairsonnage"],["le chasseur","le chaseur","le chasseure"],["réaliser","réalisser","réalizer"],
     ["étonner","étoner","éttonner"],["nombreux","nombreu","nonbreux"],["mystérieux","mistérieux","mystérieu"],
     ["impressionnant","impressionant","impréssionnant"],["beaucoup","beaucou","bocoup"],["souvent","souvant","souvemt"],

/* =========================================================
   MOTEUR DE QUESTIONS (réutilisé dans les mondes et contre le gardien)
   q = {k:'c'|'t'|'s'|'d', data, L}
   ========================================================= */
function buildQueue(L,mix){
  const q=[];
  pick(L.c,mix.c).forEach(d=>q.push({k:'c',d,L}));
  pick(L.t,mix.t).forEach(d=>q.push({k:'t',d,L}));
  const vs=pick(L.v,mix.s+mix.d);
  vs.slice(0,mix.s).forEach(d=>q.push({k:'s',d,L}));
  vs.slice(mix.s).forEach(d=>q.push({k:'d',d,L}));
  return shuffle(q);
}
const TTS = ('speechSynthesis' in window);
function say(text,rate=.8){ if(!TTS||muted)return false; try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('fr')); if(v)u.voice=v; setMusicDuck(.15); u.onend=u.onerror=()=>setMusicDuck(1); setTimeout(()=>setMusicDuck(1),4000); speechSynthesis.speak(u); return true;}catch(e){return false} }
function hasFrVoice(){try{return TTS&&speechSynthesis.getVoices().some(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'))}catch(e){return false}}
if(TTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}

function blankHTML(text){ return esc(text).replace(/_{3}/g,'<span class="blank">___</span>'); }
const ACC=["é","è","ê","à","â","ç","ô","î","û","ù","ï","ë","'","-"];
function accentBar(input){
  const d=document.createElement('div'); d.className='accents';
  ACC.forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a;b.onclick=()=>{const s=input.selectionStart??input.value.length,e=input.selectionEnd??s;input.value=input.value.slice(0,s)+a+input.value.slice(e);input.focus();input.setSelectionRange(s+1,s+1);sfx.click()};d.appendChild(b)});
  return d;
}
/* ctx: {zone, tag, hintsLeft(), useHint(), onAnswer(ok, q), onLesson()} */
function renderQ(q,ctx){
  const z=ctx.zone; z.innerHTML='';
  const card=document.createElement('div'); card.className='qcard'; z.appendChild(card);
  const tags={c:"⛏ Défi de la règle",t:"✏️ Écris la réponse",s:"📜 Mot de la dictée",d:"🔊 Dictée magique"};
  card.innerHTML=`<div class="qtag">${ctx.tag} · ${tags[q.k]}</div>`;
  const qt=document.createElement('div'); qt.className='qtext'; card.appendChild(qt);
  const body=document.createElement('div'); card.appendChild(body);
  const hintT=document.createElement('div'); hintT.className='hinttext';
  const tools=document.createElement('div'); tools.className='qtools';
  let answered=false, hintUsed=0;
  const finish=(ok,shown)=>{ if(answered)return; answered=true; ctx.onAnswer(ok,q,shown,card); };

  if(q.k==='c'||q.k==='s'){
    let opts, correct;
    if(q.k==='c'){ qt.innerHTML=blankHTML(q.d[0]); opts=q.d[1].map((o,i)=>({o,ok:i===q.d[2]})); correct=q.d[1][q.d[2]]; }
    else { qt.innerHTML=`Quelle est la bonne orthographe ?<div style="font-size:16px;font-weight:500;color:#7a5a2a;margin-top:4px">Mot de la dictée « ${esc(q.L.dictee)} »</div>`; opts=shuffle(q.d.map((o,i)=>({o,ok:i===0}))); correct=q.d[0]; }
    if(q.k==='c' && q.d[1].length===2 && !/^Quel/.test(q.d[0])) {/* garde l'ordre a/à */} else if(q.k==='c') opts=shuffle(opts);
    const box=document.createElement('div'); box.className='opts'; body.appendChild(box);
    const btns=opts.map(op=>{const b=document.createElement('button');b.className='opt';b.textContent=op.o;b.onclick=()=>{
      if(answered)return; btns.forEach(x=>x.disabled=true);
      b.classList.add(op.ok?'good':'bad'); if(!op.ok)btns.find(x=>x._ok)?.classList.add('good');
      const bl=qt.querySelector('.blank'); if(bl){bl.textContent=op.ok?op.o:correct;bl.classList.add('filled');if(!op.ok)bl.classList.add('bad')}
      finish(op.ok,correct);
    };b._ok=op.ok;box.appendChild(b);return b});
    const hb=document.createElement('button'); hb.className='hintbtn'; hb.textContent=`💡 Indice (${ctx.hintsLeft()})`; hb.disabled=ctx.hintsLeft()<=0||btns.length<=2;
    if(btns.length<=2){hb.title="Pas d'indice possible : il n'y a que deux choix !"; hb.textContent='💡 Indice : relis la leçon !';}
    hb.onclick=()=>{ if(ctx.hintsLeft()<=0)return; const wrong=btns.filter(b=>!b._ok&&!b.classList.contains('dim')); if(!wrong.length)return; ctx.useHint(); wrong[0].classList.add('dim');wrong[0].disabled=true; hb.disabled=true; hb.textContent=`💡 Indice (${ctx.hintsLeft()})`; sfx.click(); };
    tools.appendChild(hb);
    // touches clavier 1,2,3
    card._keys=e=>{const n=parseInt(e.key);if(n>=1&&n<=btns.length&&!btns[n-1].disabled)btns[n-1].click()};
  } else {
    let answers, display;
    if(q.k==='t'){ qt.innerHTML=blankHTML(q.d[0]); answers=q.d[1]; display=q.d[1][0]; }
    else {
      answers=[q.d[0]]; display=q.d[0];
      qt.innerHTML=`Écoute bien et écris le mot entendu.<div style="font-size:16px;font-weight:500;color:#7a5a2a;margin-top:4px">Dictée « ${esc(q.L.dictee)} » · le déterminant (le, la, un…) n'est pas obligatoire</div>`;
      const voice=hasFrVoice()||TTS;
      if(voice){ const sp=document.createElement('button'); sp.className='speak'; sp.innerHTML='🔊 Écouter le mot'; sp.onclick=()=>{ if(!say(q.d[0])){flash()} }; body.appendChild(sp);
        const sl=document.createElement('button'); sl.className='lessonbtn'; sl.style.marginBottom='12px'; sl.textContent='🐢 Plus lentement'; sl.onclick=()=>say(q.d[0],.5); body.appendChild(sl);
        setTimeout(()=>say(q.d[0]),450);
      }
      function flash(){ const f=document.createElement('div'); f.className='flashword'; f.textContent=q.d[0]; body.prepend(f); setTimeout(()=>f.remove(),2200); }
      if(!TTS){ const fb=document.createElement('button'); fb.className='speak'; fb.innerHTML='👀 Voir le mot 2 secondes'; fb.onclick=flash; body.appendChild(fb); }
    }
    const row=document.createElement('div'); row.className='typerow'; body.appendChild(row);
    const inp=document.createElement('input'); inp.className='typein'; inp.autocomplete='off'; inp.spellcheck=false; inp.setAttribute('autocapitalize','off'); inp.placeholder=q.k==='d'?'Écris le mot…':'Ta réponse…';
    const ok=document.createElement('button'); ok.className='mc-btn green'; ok.textContent='Valider';
    row.append(inp,ok); body.appendChild(accentBar(inp));
    const check=()=>{ if(answered)return; const v=norm(inp.value); if(!v){inp.focus();return}
      const good=answers.some(a=>{const A=norm(a); return v===A || (q.k==='d' && stripArt(v)===stripArt(A)) || (q.k==='t' && stripArt(v)===stripArt(A));});
      inp.classList.add(good?'good':'bad'); inp.disabled=true; ok.disabled=true;
      const bl=qt.querySelector('.blank'); if(bl){bl.textContent=good?inp.value.trim():display;bl.classList.add('filled');if(!good)bl.classList.add('bad')}
      finish(good,display); };
    ok.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check()};
    setTimeout(()=>inp.focus(),80);
    const hb=document.createElement('button'); hb.className='hintbtn'; hb.textContent=`💡 Indice (${ctx.hintsLeft()})`; hb.disabled=ctx.hintsLeft()<=0;
    hb.onclick=()=>{ if(ctx.hintsLeft()<=0)return; ctx.useHint(); hintUsed++; const target=stripArt(display); const n=Math.max(2,Math.ceil(target.length/3));
      hintT.textContent=`Le mot commence par : « ${target.slice(0,n)}… » (${target.length} lettres)`; hb.disabled=true; hb.textContent=`💡 Indice (${ctx.hintsLeft()})`; sfx.click(); };
    tools.appendChild(hb);
  }
  if(ctx.onLesson){const lb=document.createElement('button');lb.className='lessonbtn';lb.textContent='📜 Relire la leçon';lb.onclick=()=>{sfx.click();ctx.onLesson()};tools.appendChild(lb);}
  card.appendChild(hintT); card.appendChild(tools);
}
function showFeedback(card,ok,q,shown,onNext,label){

  const f=document.createElement('div'); f.className='feedback '+(ok?'ok':'ko');

  card.querySelectorAll('.qtools').forEach(t=>t.style.display='none');
  card.appendChild(f); const b=f.querySelector('button'); b.onclick=()=>{sfx.click();onNext()}; setTimeout(()=>{b.focus();f.scrollIntoView({behavior:'smooth',block:'nearest'})},60);

function nextQ(){ if(!W)return; if(W.broken>=W.total){completeWorld();return} const q=W.queue.shift(); W.cur=q; renderQ(q,wctx()); }
function onWorldAnswer(ok,q,shown,card){
  if(ok){ W.broken++; sfx.good(); mineBlock(W.broken-1); addXP(q.k==='c'||q.k==='s'?10:15); renderDots(); markTarget(); }
  else { W.hearts--; W.errors++; W.queue.push(q); sfx.bad(); hurt(); renderHearts(W.hearts,LV().hearts); const hs=$('hearts').children[W.hearts]; if(hs){hs.classList.add('pop')} }
  W.paused=true;
  showFeedback(card,ok,q,shown,()=>{ W.paused=false; if(W.hearts<=0){respawn('Tu as perdu tous tes cœurs !');return} nextQ(); });
}
function mineBlock(i){
  const b=W.order[i]; if(!b)return; const hero=$('hero'), pk=$('pick');
  const br=b.getBoundingClientRect(), sr=$('scene').getBoundingClientRect();
  const left=(br.left-sr.left)-58; hero.style.left=left+'px'; pk.style.left=(left+30)+'px';
  hero.classList.add('walk'); setTimeout(()=>hero.classList.remove('walk'),400);
  const cr=b.querySelector('.crack');
  [0,1,2].forEach(s=>setTimeout(()=>{pk.classList.remove('swing');void pk.offsetWidth;pk.classList.add('swing');sfx.hit();cr.style.opacity=1;cr.style.backgroundImage=`url(${crackTex(s+1)})`},380+s*170));
  setTimeout(()=>{ const p=rect(b); b.classList.add('gone'); b.classList.remove('target'); sfx.brk(); burst(p.x,p.y,26,TEX[W.L.block].base.concat(TEX[W.L.block].ore||[]),{speed:6,up:4});
    const xr=rect($('xpbar')); orbs(p.x,p.y,5,xr.x,xr.y); },380+3*170);
}
function hurt(){ const sc=$('scene'); sc.classList.remove('shake'); void sc.offsetWidth; sc.classList.add('shake'); const f=document.createElement('div'); f.className='flash-red'; $('app').appendChild(f); setTimeout(()=>f.remove(),600);
  const p=rect($('hero')); burst(p.x,p.y,14,["#e8443a","#ff7d73"],{speed:3}); }
function lavaLose(){ if(!W)return; sfx.bad(); W.paused=true; respawn('La lave a tout recouvert !'); }
function respawn(why){
  if(W&&W.timerId)clearInterval(W.timerId);
  const id=W.id;
  modal(`<h2>💀 ${why}</h2><p>Pas de panique, un vrai explorateur réessaie ! Relis bien la leçon, puis retente le monde.</p><p>Tu gardes toute ton XP.</p>
   <div class="mrow"><button class="mc-btn" id="m-map">Carte</button><button class="mc-btn green" id="m-re">Réapparaître ↻</button></div>`);
  $('m-re').onclick=()=>{closeModal();sfx.click();startWorld(id)}; $('m-map').onclick=()=>{closeModal();W=null;goMap()};
}
function completeWorld(){
  if(W.timerId)clearInterval(W.timerId);
  const L=W.L, stars=W.errors===0?3:W.errors<=2?2:1, first=!S.done[L.id];
  S.done[L.id]=true; S.stars[L.id]=Math.max(S.stars[L.id]||0,stars); save(); addXP(30+stars*10);
  $('qzone').innerHTML='';
  const ch=$('chest'), hero=$('hero'), pk=$('pick'); const cr=ch.getBoundingClientRect(), sr=$('scene').getBoundingClientRect();
  hero.style.left=(cr.left-sr.left-50)+'px'; pk.style.left=(cr.left-sr.left-20)+'px'; hero.classList.add('walk');
  setTimeout(()=>{hero.classList.remove('walk'); ch.src=spr('chestOpen'); ch.classList.add('open'); sfx.chest(); const p=rect(ch); burst(p.x,p.y,50,["#ffd23f","#fff08a","#fff",...TEX[L.block].base],{speed:7,up:5}); },700);
  setTimeout(()=>{
    sfx.level(); confetti(90);
    const d=S.digits[L.id-1];
    modal(`<div class="center"><h2>Monde ${L.id} terminé !</h2>
      <div class="bigstars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">★</span>`).join('')}</div>
      <img class="reward-img" src="${spr(L.item.spr)}" alt="">
      <p>Tu obtiens : <b>${L.item.name}</b></p>
      <p>Chiffre secret du portail n°${L.id} :</p><div class="digit">${d}</div>
      <p style="font-size:16px">${W.errors===0?'Aucune erreur, quelle maîtrise !':`${W.errors} erreur${W.errors>1?'s':''} — rejoue pour viser 3 étoiles !`}</p>
      <div class="mrow"><button class="mc-btn" id="m-again">Rejouer ↻</button><button class="mc-btn green" id="m-next">${L.id<8?'Monde suivant ▶':'Vers le Portail ▶'}</button></div></div>`);
    $('m-again').onclick=()=>{closeModal();startWorld(L.id)};
    $('m-next').onclick=()=>{closeModal(); W=null; if(L.id<8 && (unlocked(L.id+1))) { startWorld(L.id+1) } else goMap();};
    renderInv();
  },1700);
}

/* =========================================================
   FINAL : établi → code → gardien
   ========================================================= */
let B=null;
function startFinal(){
  playMusic('portal');
  show('scr-final'); hideHearts(); renderXP(); renderInv();
  const placed=[]; const f=$('final'); $('ftitle').textContent="Étape 1 : Fabrique le Cœur du Portail";
  f.innerHTML=`<div class="fstage"><p style="font-size:18px;text-align:center;max-width:420px">Clique sur les 8 objets <b>dans l'ordre des mondes</b> (1 → 8) pour les poser sur l'établi.</p><div class="craft" id="craft"></div></div>
     <div class="fstage"><div class="inv" id="finv"></div><div id="cmsg" style="font-size:18px;min-height:26px;text-align:center;max-width:300px"></div></div>`;
  const slots=[0,1,2,3,5,6,7,8]; const craft=$('craft');
  for(let i=0;i<9;i++){const s=document.createElement('div');s.className='cslot'+(i===4?' center':'');craft.appendChild(s)}
  const inv=$('finv');
  shuffle(LESSONS).forEach(L=>{const b=document.createElement('button');b.innerHTML=`<img class="px" src="${spr(L.item.spr)}"><span class="w">M${L.id}</span>`;b.title=L.item.name;
    b.onclick=()=>{ const need=placed.length+1; if(L.id!==need){sfx.bad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);$('cmsg').textContent=`Il faut d'abord l'objet du monde ${need} !`;return}
      placed.push(L); b.disabled=true; sfx.hit(); const s=craft.children[slots[placed.length-1]]; s.innerHTML=`<img class="px" src="${spr(L.item.spr)}"><span class="n">${L.id}</span>`; const p=rect(s); burst(p.x,p.y,10,["#fff","#ffd23f"],{speed:3});
      $('cmsg').textContent=`${L.item.name} placé !`;
      if(placed.length===8){ setTimeout(()=>{ const c=craft.children[4]; c.innerHTML=`<img class="px" src="${spr('core')}" style="width:54px;height:54px">`; sfx.chest(); const p=rect(c); burst(p.x,p.y,60,["#8a4dff","#4fd6cf","#ffd23f","#fff"],{speed:8});
        $('cmsg').innerHTML='<b>Cœur du Portail fabriqué !</b>'; setTimeout(codeStage,1400); },400); }
    }; inv.appendChild(b)});
}
function codeStage(){
  $('ftitle').textContent="Étape 2 : Entre le code secret";
  let code=''; const f=$('final');
  f.innerHTML=`<div class="fstage"><div class="portal" id="portal"><div class="swirl"></div></div></div>
    <div class="fstage"><p style="font-size:18px;text-align:center;max-width:340px">Tape les chiffres secrets des mondes <b>1 à 8</b>, dans l'ordre. (Tu les vois sur tes objets !)</p>
      <div class="inv" id="cinv"></div><div class="codebox" id="cbox"></div><div class="keypad" id="kp"></div></div>`;
  const ci=$('cinv'); LESSONS.forEach(L=>{const b=document.createElement('button');b.disabled=false;b.style.cursor='default';b.innerHTML=`<img class="px" src="${spr(L.item.spr)}"><span class="w">M${L.id}</span><span class="d">${S.digits[L.id-1]}</span>`;ci.appendChild(b)});
  const draw=()=>{$('cbox').innerHTML=Array.from({length:8},(_,i)=>`<span>${code[i]||''}</span>`).join('')}; draw();
  const kp=$('kp'); ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{
    if(k==='⌫'){code=code.slice(0,-1);sfx.click()} else if(k==='OK'){
      if(code===S.digits.join('')){ sfx.portal(); $('portal').classList.add('lit'); const p=rect($('portal')); burst(p.x,p.y,80,["#8a4dff","#4fd6cf","#ffd23f"],{speed:9}); setTimeout(bossStage,2200); }
      else { sfx.bad(); const cb=$('cbox'); cb.classList.remove('bad'); void cb.offsetWidth; cb.classList.add('bad'); code=''; setTimeout(draw,400); }
      return;
    } else if(code.length<8){code+=k;sfx.click()} draw(); };kp.appendChild(b)});
}
function bossStage(){
  playMusic('boss');
  $('ftitle').textContent="Étape 3 : Bats le Gardien du Portail !";
  const lv=LV(), mix={c:0,t:0,s:0,d:0};
  const pool=[]; LESSONS.forEach(L=>{ const k=lv.boss[Math.floor(Math.random()*lv.boss.length)]; const src=k==='c'?L.c:k==='t'?L.t:L.v; pool.push({k,d:src[Math.floor(Math.random()*src.length)],L}); });
  B={hp:6,max:6,hearts:lv.hearts,hints:lv.hints,queue:shuffle(pool).slice(0,6),errors:0};
  renderHearts(B.hearts,lv.hearts);
  $('final').innerHTML=`<div class="fstage boss"><img id="bossimg" src="${spr('guard')}" alt=""><div class="bosshp"><div id="bhp" style="width:100%"></div></div><div style="font-family:var(--px);font-size:10px">Gardien de Pierre</div></div>
     <div class="fstage fq" id="bq"></div>`;
  sfx.boss(); bossNext();
}
function bossNext(){
  if(B.hp<=0){ return winGame(); }
  if(!B.queue.length){ const L=LESSONS[Math.floor(Math.random()*8)]; B.queue.push({k:'c',d:L.c[Math.floor(Math.random()*L.c.length)],L}); }
  const q=B.queue.shift();
  renderQ(q,{zone:$('bq'),tag:`Monde ${q.L.id}`,hintsLeft:()=>B.hints,useHint:()=>{B.hints--},onLesson:null,onAnswer:(ok,q,shown,card)=>{
    if(ok){ B.hp--; sfx.good(); setTimeout(sfx.boss,150); const im=$('bossimg'); im.classList.remove('hit'); void im.offsetWidth; im.classList.add('hit'); const p=rect(im); burst(p.x,p.y,24,["#7d7d84","#55555c","#e8443a"],{speed:6}); $('bhp').style.width=(B.hp/B.max*100)+'%'; addXP(15); }
    else { B.hearts--; B.errors++; B.queue.push(q); sfx.bad(); renderHearts(B.hearts,LV().hearts); const f=document.createElement('div'); f.className='flash-red'; $('app').appendChild(f); setTimeout(()=>f.remove(),600); }
    showFeedback(card,ok,q,shown,()=>{ if(B.hearts<=0){ modal(`<h2>💀 Le Gardien t'a repoussé !</h2><p>Reprends des forces et retente le combat. Le portail est toujours ouvert.</p><div class="mrow"><button class="mc-btn green" id="m-b">Recommencer le combat</button></div>`); $('m-b').onclick=()=>{closeModal();bossStage()}; return;} bossNext(); }, B.hp<=0?'Victoire ! 🏆':'Attaquer ⚔');
  }});
}
function winGame(){
  playMusic('win');
  S.finished=true; save(); sfx.level(); setTimeout(sfx.portal,400); confetti(140); hideHearts();
  const tot=Object.values(S.stars).reduce((a,b)=>a+b,0);
  const date=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  show('scr-win');
  $('win').innerHTML=`<div class="cert"><img class="medal" src="${spr('medal')}" alt="">
    <h1>Diplôme du Maître<br>de l'Orthographe</h1>
    <p>est décerné à</p><div class="who">${esc(S.name)}</div>
    <p>qui s'est échappé(e) des 8 Mondes de Cubia au niveau <b>${LV().label} (${LV().sub})</b>.</p>
    <div class="stats"><div>Étoiles<b>${tot} / 24</b></div><div>Niveau XP<b>${xpLevel()}</b></div><div>Leçons<b>8 / 8</b></div></div>
    <p style="font-size:16px">${date}</p>
    <div class="mrow" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button class="mc-btn" id="w-map">Carte</button>
      ${S.level!=='diamant'?`<button class="mc-btn gold" id="w-up">Niveau supérieur ▲</button>`:''}
      <button class="mc-btn green" id="w-title">Écran titre</button></div></div>`;
  $('w-map').onclick=()=>goMap(); $('w-title').onclick=()=>{show('scr-title');buildTitle();playMusic('title')};
  const up=$('w-up'); if(up)up.onclick=()=>{ const nxt=S.level==='bois'?'fer':'diamant'; const keep={name:S.name,xp:S.xp}; S=fresh(); S.level=nxt; S.name=keep.name; S.xp=keep.xp; save(); goMap(); };
  let n=0; const iv=setInterval(()=>{ if(++n>4||!$('scr-win').classList.contains('on'))return clearInterval(iv); confetti(35); },1500);
}

/* ---------- Démarrage ---------- */
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal' && W && !W.paused===false){} });
musicOn = S.music!==false; refreshMusicBtns();
$('btn-music').onclick=toggleMusic; $('btn-music2').onclick=toggleMusic;
document.addEventListener('pointerdown',()=>{ac()},{passive:true});
playMusic('title');
buildTitle(); renderXP();
</script>
</body>
</html>
